<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>مدیریت مشتری</title>
<meta name="description" content="اپلیکیشن مدیریت مشتری، فروش و گفتگو با تقویم شمسی">
<meta name="theme-color" content="#0F5257">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script>
  /* اعمال زودهنگام حالت تاریک/روشن قبل از رندر، تا صفحه چشمک نزند */
  (function () {
    try {
      var t = localStorage.getItem('crm-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* در صورت غیرفعال بودن ذخیره‌سازی، حالت روشن پیش‌فرض است */ }
  })();
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar__title">مدیریت مشتری</div>
    <div class="topbar__date" id="topbarDate"></div>
  </header>

  <main class="view" id="view"></main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script src="idb.js"></script>
<script src="app.js"></script>
</body>
</html>
